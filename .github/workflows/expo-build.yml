name: Expo EAS Build

# iPhone build of the Capacitor app on EAS. Runs on every push to main and by hand.
# The EAS builder (macOS) runs the package.json hook `eas-build-post-install`:
# `npm run build && npx cap sync ios`, which builds the web app into dist/ and syncs it,
# plus the Capacitor plugin pods, into ios/App before xcodebuild.
# Android is not built: there is no android/ project in this repo.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Check Expo login
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami

      - name: Build iOS app (App Store)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build -p ios --non-interactive --profile production
